[project]
name = "claude-norhafsham"
version = "0.1.0"
description = "Security research notes and proof-of-concept artifacts"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["security/poc/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
