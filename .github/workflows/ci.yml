name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Upstream drift is time-based, not push-based: catch it even when nothing here
    # changes. Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  python:
    name: apply.py (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tooling
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

  typescript:
    name: PoC typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: security/poc/package-lock.json

      - name: Install
        run: npm ci
        working-directory: security/poc

      # The PoC is a fragment spliced into an upstream spec, so nothing here can
      # run it. Type-checking it against harness.d.ts is what stops a typo from
      # surviving until someone clones dex-core-v2 and waits out a 6 minute suite.
      - name: Typecheck the PoC against harness.d.ts
        run: npm run typecheck
        working-directory: security/poc

  tradingview-mcp:
    name: tradingview-mcp (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tradingview-mcp/package-lock.json

      - name: Install
        run: npm ci
        working-directory: tradingview-mcp

      - name: Lint
        run: npm run lint
        working-directory: tradingview-mcp

      # Deliberately test:unit and not test:all. The latter adds tests/e2e.test.js,
      # which needs TradingView Desktop reachable over CDP on port 9222 — no runner
      # has one, so it would fail on every push for reasons unrelated to the change.
      - name: Unit tests
        run: npm run test:unit
        working-directory: tradingview-mcp

  upstream:
    name: Upstream contract (network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip pytest

      # Checks the assumptions the PoC makes about ston-fi/dex-core-v2 @ af0a955:
      # the file hash, the anchor test, the harness symbols, and that upstream still
      # never exercises the fwdGas2 knob. A failure here means the write-up needs
      # re-verifying against current upstream, not that this repository is broken.
      - name: Verify the pinned upstream spec
        run: pytest -m network
